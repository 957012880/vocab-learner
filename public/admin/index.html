<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 | 单词书库</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); }
    .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 28px 24px 60px; }
    .admin-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .admin-head h1 { font-size: 24px; font-weight: 700; margin: 0; }
    .admin-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow);
      padding: 18px 20px; border: 1px solid var(--border); transition: var(--transition);
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .stat-card .n { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-card .l { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }
    .panel {
      background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow);
      padding: 24px; margin-bottom: 24px; border: 1px solid var(--border);
    }
    .panel h2 { font-size: 17px; font-weight: 700; margin: 0 0 18px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .panel h2::before { content: ''; width: 4px; height: 20px; background: var(--primary); border-radius: 2px; }
    table.members { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.members th, table.members td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
    table.members th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    table.members tr:last-child td { border-bottom: none; }
    table.members tr:hover td { background: var(--surface-hover); }
    .role-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .role-badge.admin { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
    .role-badge.member { background: var(--primary-light); color: var(--primary); }
    .row-actions { display: flex; gap: 8px; }
    .add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .add-form .full { grid-column: 1 / -1; }
    .add-form .actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 12px; }
    @media (max-width: 560px) { .add-form { grid-template-columns: 1fr; } }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .setting-row { display: flex; flex-direction: column; gap: 7px; }
    .setting-full { grid-column: 1 / -1; }
    .setting-label { font-size: 13px; color: var(--text-secondary); font-weight: 600; letter-spacing: 0.2px; }
    .settings-actions { margin-top: 18px; display: flex; justify-content: flex-end; }
    @media (max-width: 560px) { .settings-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span class="nav-logo">🛠️</span>
    <span class="nav-title">管理后台</span>
  </div>
  <div class="nav-actions">
    <a class="btn btn-ghost btn-sm" href="/">← 返回首页</a>
    <button class="btn btn-ghost btn-sm" onclick="Admin.logout()">退出</button>
  </div>
</nav>

<div class="admin-wrap">
  <div class="admin-head">
    <h1>用户管理</h1>
    <span id="admin-name" class="badge badge-admin"></span>
  </div>

  <div class="admin-cards" id="stat-cards">
    <div class="stat-card"><div class="n" id="stat-total">–</div><div class="l">用户总数</div></div>
    <div class="stat-card"><div class="n" id="stat-admin">–</div><div class="l">管理员</div></div>
    <div class="stat-card"><div class="n" id="stat-member">–</div><div class="l">普通会员</div></div>
  </div>

  <div class="panel">
    <h2>新增用户</h2>
    <div class="add-form">
      <input type="text" class="input" id="add-username" placeholder="用户名 (3-20字符)">
      <input type="email" class="input" id="add-email" placeholder="邮箱">
      <input type="password" class="input" id="add-password" placeholder="密码 (至少6位)">
      <select class="input" id="add-role">
        <option value="member">普通会员</option>
        <option value="admin">管理员</option>
      </select>
      <div class="actions">
        <button class="btn btn-primary" onclick="Admin.add()">添加用户</button>
      </div>
      <div class="full auth-error hidden" id="add-error"></div>
    </div>
  </div>

  <div class="panel">
    <h2>用户列表</h2>
    <div id="members-loading" class="empty-hint">加载中…</div>
    <table class="members hidden" id="members-table">
      <thead>
        <tr>
          <th>ID</th><th>用户名</th><th>邮箱</th><th>角色</th>
          <th>已掌握词</th><th>注册时间</th><th>最近登录</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="members-body"></tbody>
    </table>
    <div id="members-empty" class="empty-hint hidden">暂无用户</div>
  </div>

  <!-- 网站设置面板 -->
  <div class="panel" id="settings-panel">
    <h2>网站设置</h2>
    <div id="settings-loading" class="empty-hint">加载中…</div>
    <div id="settings-form" class="hidden">
      <div class="settings-grid">
        <label class="setting-row">
          <span class="setting-label">站点名称</span>
          <input type="text" class="input" id="set-site-name" placeholder="单词书库">
        </label>
        <label class="setting-row">
          <span class="setting-label">开放注册</span>
          <select class="input" id="set-allow-register">
            <option value="1">允许新用户注册</option>
            <option value="0">关闭注册（仅管理员可建用户）</option>
          </select>
        </label>
        <label class="setting-row">
          <span class="setting-label">游客浏览</span>
          <select class="input" id="set-guest-browse">
            <option value="1">允许游客浏览词书</option>
            <option value="0">必须登录才能浏览</option>
          </select>
        </label>
        <label class="setting-row">
          <span class="setting-label">维护模式</span>
          <select class="input" id="set-maintenance">
            <option value="0">正常运行</option>
            <option value="1">维护模式（仅管理员可访问）</option>
          </select>
        </label>
        <label class="setting-row setting-full">
          <span class="setting-label">站点公告</span>
          <textarea class="input" id="set-announcement" rows="2" placeholder="留空则不显示公告"></textarea>
        </label>
      </div>
      <div class="settings-actions">
        <button class="btn btn-primary" onclick="Admin.saveSettings()">保存设置</button>
      </div>
      <div class="auth-error hidden" id="settings-error"></div>
    </div>
  </div>

  <!-- 邮件（SMTP）配置面板 -->
  <div class="panel" id="smtp-panel">
    <h2>📧 邮件服务（SMTP）</h2>
    <p style="font-size:13px;color:var(--text-muted);margin:-8px 0 16px;">配置后，注册验证、密码重置等邮件将通过 SMTP 真实发送。未配置时验证码仅记录到服务端日志（便于测试）。</p>
    <div class="settings-grid">
      <label class="setting-row">
        <span class="setting-label">SMTP 服务器</span>
        <input type="text" class="input" id="set-smtp_host" placeholder="smtp.example.com">
      </label>
      <label class="setting-row">
        <span class="setting-label">端口</span>
        <input type="number" class="input" id="set-smtp_port" placeholder="587">
      </label>
      <label class="setting-row">
        <span class="setting-label">用户名 / 邮箱</span>
        <input type="text" class="input" id="set-smtp_user" placeholder="user@example.com">
      </label>
      <label class="setting-row">
        <span class="setting-label">密码 / 授权码</span>
        <input type="password" class="input" id="set-smtp_password" placeholder="授权码（非登录密码）">
      </label>
      <label class="setting-row">
        <span class="setting-label">发件人地址</span>
        <input type="text" class="input" id="set-smtp_from" placeholder="noreply@example.com">
      </label>
      <label class="setting-row">
        <span class="setting-label">加密方式</span>
        <select class="input" id="set-smtp_secure">
          <option value="false">STARTTLS（端口 587）</option>
          <option value="true">隐式 TLS（端口 465）</option>
        </select>
      </label>
    </div>
    <div class="settings-actions">
      <button class="btn btn-primary" onclick="Admin.saveSettings()">保存设置</button>
    </div>
    <div class="auth-error hidden" id="smtp-error"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
