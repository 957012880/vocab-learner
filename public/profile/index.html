<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 | 单词书库</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); }
    .profile-wrap { max-width: 960px; margin: 0 auto; padding: 28px 24px 60px; }

    /* 用户头部 */
    .profile-header {
      display: flex; align-items: center; gap: 20px;
      background: var(--surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); padding: 28px; margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      box-shadow: var(--shadow-md);
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .profile-email { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
    .profile-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .verified-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--green); font-weight: 600; }
    .verified-badge::before { content: '✓'; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #fff; font-size: 10px; }
    .unverified-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--yellow); font-weight: 600; }
    .unverified-badge::before { content: '!'; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; background: var(--yellow); color: #fff; font-size: 10px; }

    /* 网格布局 */
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card {
      background: var(--surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); padding: 24px; border: 1px solid var(--border);
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-md); }
    .card-title { font-size: 16px; font-weight: 700; margin: 0 0 18px; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .card-title::before { content: ''; width: 4px; height: 18px; background: var(--primary); border-radius: 2px; }
    .card-full { grid-column: 1 / -1; }

    /* 表单 */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; display: block; letter-spacing: 0.2px; }
    .form-row { display: flex; gap: 10px; align-items: flex-end; }
    .form-row .form-group { flex: 1; margin-bottom: 0; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* 统计卡片 */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stat-item { text-align: center; padding: 18px 12px; background: var(--bg); border-radius: var(--radius); border: 1px solid var(--border); }
    .stat-num { font-size: 32px; font-weight: 800; color: var(--primary); line-height: 1.2; }
    .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

    /* 徽章 */
    .badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px; }
    .badge-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 18px 12px; background: var(--bg); border-radius: var(--radius);
      border: 1px solid var(--border); transition: var(--transition); text-align: center;
    }
    .badge-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .badge-icon { font-size: 36px; line-height: 1; }
    .badge-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .badge-desc { font-size: 11px; color: var(--text-muted); line-height: 1.3; }
    .badge-locked { opacity: 0.4; filter: grayscale(1); }

    /* 加载/错误 */
    .card-loading { text-align: center; padding: 32px; color: var(--text-muted); font-size: 14px; }
    .card-error { text-align: center; padding: 24px; color: var(--red); font-size: 13px; background: var(--red-light); border-radius: var(--radius-sm); }

    @media (max-width: 640px) {
      .profile-wrap { padding: 20px 16px 40px; }
      .profile-header { flex-direction: column; text-align: center; padding: 20px; }
      .profile-meta { justify-content: center; }
      .profile-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .stat-num { font-size: 24px; }
      .badges-grid { grid-template-columns: repeat(3, 1fr); }
      .form-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
      <span class="nav-logo">📚</span>
      <span class="nav-title">单词书库</span>
    </a>
  </div>
  <div class="nav-actions">
    <a class="btn btn-ghost btn-sm" href="/">← 返回首页</a>
    <button class="btn btn-ghost btn-sm" onclick="Profile.logout()">退出</button>
  </div>
</nav>

<div class="profile-wrap">

  <!-- 用户头部 -->
  <div class="profile-header">
    <div class="profile-avatar" id="avatar-initials">?</div>
    <div class="profile-info">
      <div class="profile-name" id="profile-name">加载中…</div>
      <div class="profile-email" id="profile-email">—</div>
      <div class="profile-meta">
        <span id="profile-role" class="badge badge-admin hidden">管理员</span>
        <span id="profile-verified"></span>
      </div>
    </div>
  </div>

  <div class="profile-grid">

    <!-- 个人信息编辑 -->
    <div class="card">
      <div class="card-title">个人信息</div>
      <div class="form-group">
        <label class="form-label">昵称</label>
        <input type="text" class="input" id="edit-nickname" placeholder="设置昵称" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="input" id="edit-email" placeholder="邮箱地址" disabled>
        <div class="form-hint">邮箱不可修改，如需更改请联系管理员</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary btn-sm" id="save-profile-btn" onclick="Profile.updateProfile()">保存修改</button>
      </div>
      <div class="auth-error hidden" id="profile-error"></div>
    </div>

    <!-- 安全设置 -->
    <div class="card">
      <div class="card-title">安全设置</div>
      <div class="form-group">
        <label class="form-label">当前密码</label>
        <input type="password" class="input" id="pwd-current" placeholder="输入当前密码">
      </div>
      <div class="form-group">
        <label class="form-label">新密码</label>
        <input type="password" class="input" id="pwd-new" placeholder="新密码（至少6位）" minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label">确认新密码</label>
        <input type="password" class="input" id="pwd-confirm" placeholder="再次输入新密码">
      </div>
      <div class="form-group" id="email-code-group" class="hidden">
        <label class="form-label">邮箱验证码</label>
        <div class="form-row">
          <div class="form-group">
            <input type="text" class="input" id="pwd-code" placeholder="输入验证码" maxlength="6">
          </div>
          <button class="btn btn-outline btn-sm" id="send-code-btn" onclick="Profile.sendVerificationCode()">发送验证码</button>
        </div>
        <div class="form-hint">验证码已发送至您的邮箱</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost btn-sm" id="change-pwd-toggle" onclick="Profile.togglePasswordSection()">修改密码</button>
        <button class="btn btn-primary btn-sm hidden" id="change-pwd-btn" onclick="Profile.changePassword()">确认修改</button>
      </div>
      <div class="auth-error hidden" id="pwd-error"></div>
    </div>

    <!-- 学习统计 -->
    <div class="card card-full">
      <div class="card-title">学习统计</div>
      <div id="stats-loading" class="card-loading">加载中…</div>
      <div id="stats-content" class="hidden">
        <div class="stats-row">
          <div class="stat-item"><div class="stat-num" id="stat-words">–</div><div class="stat-label">已掌握词数</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-days">–</div><div class="stat-label">学习天数</div></div>
          <div class="stat-item"><div class="stat-num" id="stat-streak">–</div><div class="stat-label">连续打卡</div></div>
        </div>
      </div>
      <div id="stats-error" class="hidden"></div>
    </div>

    <!-- 成就徽章 -->
    <div class="card card-full">
      <div class="card-title">成就徽章</div>
      <div id="achievements-loading" class="card-loading">加载中…</div>
      <div id="achievements-content" class="hidden">
        <div class="badges-grid" id="badges-grid"></div>
      </div>
      <div id="achievements-empty" class="hidden empty-hint">暂无成就徽章</div>
      <div id="achievements-error" class="hidden"></div>
    </div>

  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/api.js"></script>
<script src="/profile/profile.js"></script>
</body>
</html>
