# Cloudflare Pages 配置
# 部署前请替换 name 和 d1_databases 中的 database_id

name = "vocab-learner"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# D1 数据库绑定
# 部署步骤:
# 1. npx wrangler d1 create vocab-db  (会输出 database_id)
# 2. 把下面的 database_id 替换为实际值
[[d1_databases]]
binding = "DB"
database_name = "vocab-db"
database_id = "YOUR_DATABASE_ID_HERE"

# 环境变量 (JWT 密钥)
# 生产环境建议用 wrangler secret put JWT_SECRET 设置
[vars]
JWT_SECRET = "change-this-to-a-random-secret-string"
