# Cloudflare Pages 配置
# 部署前请替换 name 和 d1_databases 中的 database_id

name = "vocab-learner"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# D1 数据库绑定
# 部署步骤:
# 1. npx wrangler d1 create vocab-db  (会输出 database_id)
# 2. 把下面的 database_id 替换为实际值
[[d1_databases]]
binding = "DB"
database_name = "vocab-db"
database_id = "127f4036-91f3-45f5-b6ee-838a20140f99"

# JWT 密钥已通过 `wrangler pages secret put JWT_SECRET` 注入（服务端存储，不进仓库）。
# Functions 中通过 env.JWT_SECRET 读取，无需在此 [vars] 中重复定义（否则会报绑定名冲突）。
